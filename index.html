    <!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaffeekosten Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #2b2620;
      --muted: #8a8175;
      --accent: #6f4e37; /* Kaffee-Braun */
      --border: #e5ddd2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    form {
      display: grid;
      gap: 0.9rem;
    }

    label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    input {
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button[type="submit"] {
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    button[type="submit"]:hover { opacity: 0.9; }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 0.75rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li.entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }

    li.entry:last-child { border-bottom: none; }

    .entry-date { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .entry-note { flex: 1; overflow-wrap: anywhere; }
    .entry-amount { font-weight: 600; white-space: nowrap; }

    button.delete {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 0.25rem;
    }

    button.delete:hover { color: #b3402a; }

    .empty-state {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem 0;
    }

    /* Statistiken */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
    }

    .stat-label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* Chart */
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .chart-header h2 { margin: 0; }

    button.chart-toggle {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    button.chart-toggle:hover { color: var(--accent); border-color: var(--accent); }

    .chart-wrapper {
      position: relative;
      height: 220px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>&#9749; Kaffeekosten</h1>

    <!-- Formular: Ausgabe eintragen -->
    <section class="card">
      <form id="expense-form" novalidate>
        <label>
          Datum
          <input type="date" id="date" required />
        </label>
        <label>
          Betrag (€)
          <input type="number" id="amount" min="0.01" step="0.01" placeholder="3,50" required />
        </label>
        <label>
          Notiz (optional)
          <input type="text" id="note" maxlength="60" placeholder="z. B. Flat White" />
        </label>
        <button type="submit">Speichern</button>
      </form>
    </section>

    <!-- Statistiken -->
    <section class="card">
      <h2>Statistik</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Gesamt</span>
          <span class="stat-value" id="stat-total">0,00 €</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Dieser Monat</span>
          <span class="stat-value" id="stat-month">0,00 €</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Einträge</span>
          <span class="stat-value" id="stat-count">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Ø pro Tag</span>
          <span class="stat-value" id="stat-avg">–</span>
        </div>
      </div>
    </section>

    <!-- Kostenverlauf (Chart.js) -->
    <section class="card">
      <div class="chart-header">
        <h2>Kosten der letzten 14 Tage</h2>
        <button type="button" id="chart-type-btn" class="chart-toggle">&#128200; Linie anzeigen</button>
      </div>
      <div class="chart-wrapper">
        <canvas id="cost-chart"></canvas>
      </div>
    </section>

    <!-- Liste der Einträge -->
    <section class="card">
      <h2>Einträge</h2>
      <ul id="expense-list"></ul>
      <p id="empty-state" class="empty-state" hidden>Noch keine Einträge – trage oben deine erste Kaffeeausgabe ein.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
